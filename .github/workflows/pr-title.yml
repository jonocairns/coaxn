name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  validate:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const valid = /^(?:(?:feat|fix)(?:\([a-z0-9][a-z0-9-]*\))?!?|(?:perf|docs|test|ci|build|style|refactor|revert|deps|chore)(?:\([a-z0-9][a-z0-9-]*\))?): \S(?:.*\S)?$/.test(title);
          if (!valid) {
            console.error("::error::Use a Conventional Commit title with a nonempty summary. Only feat and fix may use !. Allowed types: feat, fix, perf, docs, test, ci, build, style, refactor, revert, deps, chore.");
            process.exitCode = 1;
          }
          NODE
